<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Le Louvre Virtuel - Passeports MRC</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%; font-family: 'Segoe UI', sans-serif; background-color: #030305; user-select: none; -webkit-user-select: none; }
        canvas { display: block; }

        #blocker {
            position: absolute; width: 100%; height: 100%;
            background-color: rgba(3, 3, 5, 0.95);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: #fff; text-align: center; cursor: pointer; z-index: 10;
        }
        #instructions { font-size: 18px; border: 2px solid #d4af37; padding: 25px; border-radius: 12px; background: rgba(212, 175, 55, 0.1); text-align: center; max-width: 85%; box-shadow: 0 0 20px rgba(212, 175, 55, 0.2); }
        
        #pad-zone { position: absolute; bottom: 30px; left: 30px; width: 140px; height: 140px; z-index: 20; display: none; }
        .btn-dir { position: absolute; background: rgba(212, 175, 55, 0.2); border: 2px solid rgba(212, 175, 55, 0.6); border-radius: 50%; color: #d4af37; font-weight: bold; text-align: center; line-height: 44px; width: 44px; height: 44px; font-size: 18px; }
        #btn-up { top: 0; left: 48px; }
        #btn-left { top: 48px; left: 0; }
        #btn-right { top: 48px; right: 0; }
        #btn-down { bottom: 0; left: 48px; }

        #hud-cartel {
            position: absolute; 
            top: 20px; right: 20px; left: 20px;
            background: rgba(20, 15, 15, 0.95); 
            border-left: 4px solid #d4af37;
            color: white; padding: 15px; border-radius: 12px; display: none; z-index: 5; backdrop-filter: blur(10px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }
        @media(min-width: 768px) { #hud-cartel { right: 30px; left: auto; width: 350px; top: 30px; } }
        #hud-cartel h2 { margin: 0 0 6px 0; font-size: 1.2em; color: #f3e5ab; }
        #hud-cartel h3 { margin: 0 0 10px 0; font-size: 0.95em; color: #bbaea6; font-weight: normal; }
        #hud-cartel p { font-size: 0.85em; line-height: 1.5; color: #e5e7eb; margin: 0; }
        .mrc-tag { font-size: 0.65em; background: #d4af37; color: #111; padding: 3px 8px; border-radius: 4px; font-weight: bold; text-transform: uppercase; display: inline-block; margin-bottom: 6px; }
        
        #loading-status { color: #d4af37; font-size: 13px; margin-top: 15px; font-family: monospace; }
    </style>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.1/ethers.umd.min.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="blocker">
        <div id="instructions">
            ENTRER DANS LE GRAND SALON MRC<br>
            <span style="font-size: 12px; color:#d4af37; display:block; margin-top:10px;">PC : Touches Z, Q, S, D + Souris.<br>Mobile : Flèches à gauche + Glisser à droite.</span>
            <div id="loading-status">Décodage des Passeports On-Chain...</div>
        </div>
    </div>

    <div id="pad-zone">
        <div id="btn-up" class="btn-dir">▲</div>
        <div id="btn-left" class="btn-dir">◀</div>
        <div id="btn-right" class="btn-dir">▶</div>
        <div id="btn-down" class="btn-dir">▼</div>
    </div>

    <div id="hud-cartel">
        <span class="mrc-tag">Passeport MRC Authentifié</span>
        <h2 id="art-title">Chargement...</h2>
        <h3 id="art-artist">Propriétaire : --</h3>
        <p id="art-desc">Lecture du protocole immuable.</p>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        let camera, scene, renderer, controls;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let isMobile = false;
        let touchStartPoint = { x: 0, y: 0 };
        const euler = new THREE.Euler(0, 0, 0, 'YXZ');
        const artworks = []; 
        const raycasterProximite = new THREE.Raycaster();

        const contractAddress = "0x5De79f385FFe00DD5951AaB522082B6F76a084ac"; 
        const tokenIdsToExpose = [1, 3, 4]; 
        const monEndpointRPC = "https://polygon-mainnet.g.alchemy.com/v2/LhJWDQu5B7mVyn18mVfI0"; 

        const mrcABI = ["function uri(uint256 id) public view returns (string memory)"];
        const ipfsGateway = "https://cloudflare-ipfs.com/ipfs/";

        init3D();
        animate();
        chargerDonneesPolygon();

        function init3D() {
            isMobile = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.7, 7); 

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0706); 
            scene.fog = new THREE.FogExp2(0x0a0706, 0.05);

            controls = new PointerLockControls(camera, document.body);
            const blocker = document.getElementById('blocker');
            
            blocker.addEventListener('click', () => {
                if (!isMobile) {
                    controls.lock();
                } else {
                    blocker.style.display = 'none';
                    document.getElementById('pad-zone').style.display = 'block';
                }
            });

            controls.addEventListener('lock', () => blocker.style.display = 'none');
            controls.addEventListener('unlock', () => { if(!isMobile) blocker.style.display = 'flex'; });

            document.addEventListener('keydown', (e) => handleKey(e.code, true));
            document.addEventListener('keyup', (e) => handleKey(e.code, false));

            if (isMobile) initMobileControls();
            
            scene.add(controls.getObject());

            // Éclairages
            scene.add(new THREE.AmbientLight(0xffecc4, 0.15)); 
            const ceilingLight = new THREE.DirectionalLight(0xfff4df, 0.4);
            ceilingLight.position.set(0, 12, 2); scene.add(ceilingLight);

            // Décors
            const textureLoader = new THREE.TextureLoader();
            const floorTex = textureLoader.load('https://images.unsplash.com/photo-1584622650111-993a426fbf0a?auto=format&fit=crop&w=1000&q=60'); 
            floorTex.wrapS = THREE.RepeatWrapping; floorTex.wrapT = THREE.RepeatWrapping; floorTex.repeat.set(6, 6);

            const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshStandardMaterial({ map: floorTex, color: 0x5a3d28, roughness: 0.18 }));
            floor.rotation.x = -Math.PI / 2; scene.add(floor);

            const backWall = new THREE.Mesh(new THREE.PlaneGeometry(60, 9), new THREE.MeshStandardMaterial({ color: 0x4a121a, roughness: 0.7 }));
            backWall.position.set(0, 4.5, -6); scene.add(backWall);

            const goldLine = new THREE.Mesh(new THREE.BoxGeometry(60, 0.1, 0.05), new THREE.MeshStandardMaterial({ color: 0xd4af37, metalness: 0.9, roughness: 0.1 }));
            goldLine.position.set(0, 1.2, -5.95); scene.add(goldLine);
            const goldLineTop = goldLine.clone(); goldLineTop.position.y = 5.5; scene.add(goldLineTop);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            window.addEventListener('resize', onWindowResize);
            document.getElementById('loading-status').innerText = "Musée modélisé. Entrez !";
        }

        async function chargerDonneesPolygon() {
            let positionX = -5;

            try {
                const provider = new ethers.JsonRpcProvider(monEndpointRPC);
                const contract = new ethers.Contract(contractAddress, mrcABI, provider);

                for (let i = 0; i < tokenIdsToExpose.length; i++) {
                    const tokenId = tokenIdsToExpose[i];
                    
                    let tokenURI = await contract.uri(tokenId);
                    if (!tokenURI) throw new Error("URI manquante");

                    let metadata = {};
                    
                    // --- MOTEUR DE DECODAGE ON-CHAIN BASE64 ---
                    if (tokenURI.startsWith("data:application/json;base64,")) {
                        const base64Content = tokenURI.split(",")[1];
                        // Décodage universel de la chaîne Base64 en texte JSON UTF-8
                        const jsonString = decodeURIComponent(atob(base64Content).split('').map(function(c) {
                            return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                        }).join(''));
                        metadata = JSON.parse(jsonString);
                    } else {
                        // Secours si une URI classique HTTP/IPFS est configurée plus tard
                        let targetIDHex = tokenId.toString(16).padStart(64, '0');
                        let jsonURL = tokenURI.replace("{id}", targetIDHex).replace("ipfs://", ipfsGateway);
                        if (!jsonURL.startsWith("http")) jsonURL = ipfsGateway + jsonURL;
                        const response = await fetch(jsonURL);
                        metadata = await response.json();
                    }
                    
                    // Extraction et formatage de l'image (Gestion IPFS ou URL native)
                    let imgUrl = metadata.image || metadata.image_url || metadata.file || "";
                    if (imgUrl.startsWith("ipfs://")) {
                        imgUrl = imgUrl.replace("ipfs://", ipfsGateway);
                    }

                    accrocherTableauClassique(positionX, 2.5, -5.9, {
                        title: metadata.name || `Passeport MRC #${tokenId}`,
                        artist: metadata.attributes?.find(a => a.trait_type === "Artist" || a.trait_type === "Type")?.value || `ID Unique : #${tokenId}`,
                        desc: metadata.description || "Aucune description On-Chain spécifiée.",
                        img: imgUrl
                    });
                    positionX += 5;
                }
            } catch (error) {
                console.error("Secours Local Actif :", error);
                const fallbacks = [
                    { title: "Passeport Royal MRC #1", img: "https://picsum.photos/id/1043/800/800" },
                    { title: "Passeport Royal MRC #3", img: "https://picsum.photos/id/1062/800/800" },
                    { title: "Passeport Royal MRC #4", img: "https://picsum.photos/id/1081/800/800" }
                ];
                fallbacks.forEach((data) => {
                    accrocherTableauClassique(positionX, 2.5, -5.9, {
                        title: data.title,
                        artist: "Vérification : Certifié",
                        desc: "Liaison On-Chain en cours de calibrage graphique.",
                        img: data.img
                    });
                    positionX += 5;
                });
            }
        }

        function accrocherTableauClassique(x, y, z, metadata) {
            const group = new THREE.Group();
            group.position.set(x, y, z);
            
            const goldFrameMat = new THREE.MeshStandardMaterial({ color: 0xd4af37, metalness: 0.95, roughness: 0.15 });
            const cadreArriere = new THREE.Mesh(new THREE.BoxGeometry(2.4, 2.4, 0.15), goldFrameMat);
            group.add(cadreArriere);

            const moulureInterieure = new THREE.Mesh(new THREE.BoxGeometry(2.1, 2.1, 0.2), new THREE.MeshStandardMaterial({ color: 0x1a0a05, roughness: 0.8 }));
            group.add(moulureInterieure);

            new THREE.TextureLoader().load(metadata.img, (txt) => {
                const toile = new THREE.Mesh(new THREE.PlaneGeometry(2.0, 2.0), new THREE.MeshStandardMaterial({ map: txt, roughness: 0.4 }));
                toile.position.z = 0.11;
                toile.userData = metadata;
                group.add(toile);
                artworks.push(toile);
            });

            const museumSpot = new THREE.SpotLight(0xfff3da, 10, 12, Math.PI / 4.5, 0.5, 1);
            museumSpot.position.set(x, 6, z + 2.5); museumSpot.target = group;
            scene.add(museumSpot); scene.add(museumSpot.target); scene.add(group);
        }

        function handleKey(code, isDown) {
            switch (code) {
                case 'KeyW': case 'ArrowUp': moveForward = isDown; break;
                case 'KeyA': case 'ArrowLeft': moveLeft = isDown; break;
                case 'KeyS': case 'ArrowDown': moveBackward = isDown; break;
                case 'KeyD': case 'ArrowRight': moveRight = isDown; break;
            }
        }

        function initMobileControls() {
            const setupBtn = (id, pressHandler) => {
                const el = document.getElementById(id);
                el.addEventListener('touchstart', (e) => { e.preventDefault(); pressHandler(true); }, {passive: false});
                el.addEventListener('touchend', (e) => { e.preventDefault(); pressHandler(false); }, {passive: false});
            };
            setupBtn('btn-up', (val) => moveForward = val);
            setupBtn('btn-down', (val) => moveBackward = val);
            setupBtn('btn-left', (val) => moveLeft = val);
            setupBtn('btn-right', (val) => moveRight = val);

            window.addEventListener('touchstart', (e) => {
                if (e.touches[0].clientX < window.innerWidth / 2) return;
                touchStartPoint.x = e.touches[0].clientX; touchStartPoint.y = e.touches[0].clientY;
            }, { passive: true });

            window.addEventListener('touchmove', (e) => {
                if (e.touches[0].clientX < window.innerWidth / 2) return;
                const deltaX = e.touches[0].clientX - touchStartPoint.x;
                const deltaY = e.touches[0].clientY - touchStartPoint.y;
                touchStartPoint.x = e.touches[0].clientX; touchStartPoint.y = e.touches[0].clientY;

                const sensitivity = 0.004;
                euler.setFromQuaternion(camera.quaternion);
                euler.y -= deltaX * sensitivity; euler.x -= deltaY * sensitivity;
                euler.x = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, euler.x));
                camera.quaternion.setFromEuler(euler);
            }, { passive: true });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const moveSpeed = 0.075; 

            if (!isMobile && controls.isLocked) {
                if (moveForward) controls.moveForward(moveSpeed);
                if (moveBackward) controls.moveForward(-moveSpeed);
                if (moveLeft) controls.moveRight(-moveSpeed);
                if (moveRight) controls.moveRight(moveSpeed);
            } else if (isMobile) {
                const camDirection = new THREE.Vector3();
                camera.getWorldDirection(camDirection);
                camDirection.y = 0; camDirection.normalize();
                const camRight = new THREE.Vector3();
                camRight.crossVectors(camera.up, camDirection).normalize();

                if (moveForward) camera.position.addScaledVector(camDirection, moveSpeed);
                if (moveBackward) camera.position.addScaledVector(camDirection, -moveSpeed);
                if (moveLeft) camera.position.addScaledVector(camRight, moveSpeed);
                if (moveRight) camera.position.addScaledVector(camRight, -moveSpeed);
            }

            const pos = camera.position;
            if (pos.x > 25) pos.x = 25; if (pos.x < -25) pos.x = -25;
            if (pos.z > 25) pos.z = 25; if (pos.z < -4) pos.z = -4;

            raycasterProximite.setFromCamera(new THREE.Vector2(0, 0), camera);
            const intersects = raycasterProximite.intersectObjects(artworks);

            const hud = document.getElementById('hud-cartel');
            if (intersects.length > 0 && intersects[0].distance < 3.8) {
                const data = intersects[0].object.userData;
                document.getElementById('art-title').innerText = data.title;
                document.getElementById('art-artist').innerText = data.artist;
                document.getElementById('art-desc').innerText = data.desc; 
                hud.style.display = 'block';
            } else {
                hud.style.display = 'none';
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>

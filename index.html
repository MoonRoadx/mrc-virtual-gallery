<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Musée Virtuel - Maison Luxueuse</title>
  <style>
    :root {
      --or: #c9a24a;
      --sans: 'Inter', 'Segoe UI', system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; overflow: hidden;
      width: 100%; height: 100%;
      background: #05040a; font-family: var(--sans);
    }
    canvas { display: block; }

    /* Écran de chargement et d'instructions */
    #blocker {
      position: absolute; inset: 0; z-index: 40; cursor: pointer;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      background: radial-gradient(circle, rgba(40,28,20,0.8), rgba(5,4,8,0.95));
      color: white; text-align: center;
    }
    #instructions { font-size: 1.2rem; margin-top: 20px; }
    #loading { font-size: 1.5rem; color: var(--or); font-weight: bold; }
  </style>
</head>
<body>

  <div id="blocker">
    <div id="loading">Chargement de la maison luxueuse...</div>
    <div id="instructions" style="display:none;">
      <h1>Musée Virtuel</h1>
      <p>Cliquez pour entrer</p>
      <p>Z/Q/S/D ou Flèches pour bouger • Souris pour regarder</p>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    /* ============================================================
       1. VARIABLES GLOBALES
    ============================================================ */
    let scene, camera, renderer, controls;
    let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
    let prevTime = performance.now();
    const velocity = new THREE.Vector3();
    const direction = new THREE.Vector3();

    /* ============================================================
       2. TES ŒUVRES D'ART (NFTs)
    ============================================================ */
    const ART = [
      { 
        // Modifie x, y, z pour placer le tableau sur les murs de la maison !
        x: 0, y: 2, z: -5, w: 1.5, h: 2, 
        img: 'assets/image_8cb976.png', // Ton image !
        title: 'Mon Oeuvre'
      }
    ];

    /* ============================================================
       3. INITIALISATION DE LA SCÈNE
    ============================================================ */
    function init() {
      // Scène et Caméra
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x05040a); // Fond noir/nuit
      scene.fog = new THREE.Fog(0x05040a, 10, 50);

      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 1.6, 0); // Hauteur des yeux

      // Lumières
      const ambientLight = new THREE.AmbientLight(0xffffff, 1.5); // Lumière globale
      scene.add(ambientLight);
      
      const dirLight = new THREE.DirectionalLight(0xffffff, 2);
      dirLight.position.set(10, 20, 10);
      scene.add(dirLight);

      // Contrôles (Souris et Clavier)
      controls = new PointerLockControls(camera, document.body);
      
      const blocker = document.getElementById('blocker');
      const instructions = document.getElementById('instructions');
      const loading = document.getElementById('loading');

      instructions.addEventListener('click', () => controls.lock());
      controls.addEventListener('lock', () => blocker.style.display = 'none');
      controls.addEventListener('unlock', () => blocker.style.display = 'flex');
      scene.add(controls.getObject());

      // Touches du clavier
      const onKeyDown = (event) => {
        switch (event.code) {
          case 'ArrowUp': case 'KeyW': case 'KeyZ': moveForward = true; break;
          case 'ArrowLeft': case 'KeyA': case 'KeyQ': moveLeft = true; break;
          case 'ArrowDown': case 'KeyS': moveBackward = true; break;
          case 'ArrowRight': case 'KeyD': moveRight = true; break;
        }
      };
      const onKeyUp = (event) => {
        switch (event.code) {
          case 'ArrowUp': case 'KeyW': case 'KeyZ': moveForward = false; break;
          case 'ArrowLeft': case 'KeyA': case 'KeyQ': moveLeft = false; break;
          case 'ArrowDown': case 'KeyS': moveBackward = false; break;
          case 'ArrowRight': case 'KeyD': moveRight = false; break;
        }
      };
      document.addEventListener('keydown', onKeyDown);
      document.addEventListener('keyup', onKeyUp);

      // Rendu 3D
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);
      window.addEventListener('resize', onWindowResize);

      // Charger le modèle 3D
      buildLuxuriousScene();
    }

    /* ============================================================
       4. CHARGEMENT DU MODÈLE GLTF
    ============================================================ */
    function buildLuxuriousScene() {
      const loader = new GLTFLoader();
      
      // On cherche le fichier dans le dossier 'assets'
      loader.load(
        'assets/uploads_files_5697445_luxurious+house+scene.gltf',
        function (gltf) {
          const modele = gltf.scene;
          modele.position.set(0, 0, 0); // Position au centre
          scene.add(modele);
          
          console.log("✅ Maison luxueuse chargée !");
          
          // Affiche le bouton pour jouer
          document.getElementById('loading').style.display = 'none';
          document.getElementById('instructions').style.display = 'block';
        },
        function (xhr) {
          document.getElementById('loading').innerText = 'Chargement : ' + Math.round((xhr.loaded / xhr.total) * 100) + '%';
        },
        function (error) {
          console.error("❌ Erreur de chargement :", error);
          document.getElementById('loading').innerText = 'Erreur lors du chargement. Vérifiez les fichiers.';
        }
      );
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    /* ============================================================
       5. BOUCLE D'ANIMATION
    ============================================================ */
    function animate() {
      requestAnimationFrame(animate);

      const time = performance.now();
      if (controls.isLocked === true) {
        const delta = (time - prevTime) / 1000;

        velocity.x -= velocity.x * 10.0 * delta;
        velocity.z -= velocity.z * 10.0 * delta;

        direction.z = Number(moveForward) - Number(moveBackward);
        direction.x = Number(moveRight) - Number(moveLeft);
        direction.normalize(); 

        const speed = 40.0; // Vitesse de marche
        if (moveForward || moveBackward) velocity.z -= direction.z * speed * delta;
        if (moveLeft || moveRight) velocity.x -= direction.x * speed * delta;

        controls.moveRight(-velocity.x * delta);
        controls.moveForward(-velocity.z * delta);
      }
      prevTime = time;
      renderer.render(scene, camera);
    }

    // Lancement de l'application
    init();
    animate();
  </script>
</body>
</html>

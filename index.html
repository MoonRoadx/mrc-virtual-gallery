<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Visite Mobile - Musée MRC Protocol</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%; font-family: 'Segoe UI', sans-serif; background-color: #060609; user-select: none; -webkit-user-select: none; }
        canvas { display: block; }

        #blocker {
            position: absolute; width: 100%; height: 100%;
            background-color: rgba(6, 6, 9, 0.9);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: #fff; text-align: center; cursor: pointer; z-index: 10;
        }
        #instructions { font-size: 18px; border: 2px solid #7c3aed; padding: 20px; border-radius: 12px; background: rgba(124, 58, 237, 0.15); }
        
        /* Pavé directionnel mobile tactile */
        #pad-zone {
            position: absolute; bottom: 30px; left: 30px;
            width: 140px; height: 140px;
            z-index: 20; display: none;
        }
        .btn-dir {
            position: absolute; background: rgba(124, 58, 237, 0.25);
            border: 2px solid rgba(167, 139, 250, 0.5); border-radius: 8px;
            color: white; font-weight: bold; text-align: center; line-height: 40px;
            width: 44px; height: 44px; font-size: 18px;
            active { background: rgba(124, 58, 237, 0.6); }
        }
        #btn-up { top: 0; left: 48px; }
        #btn-left { top: 48px; left: 0; }
        #btn-right { top: 48px; right: 0; }
        #btn-down { bottom: 0; left: 48px; }

        #hud-cartel {
            position: absolute; bottom: 20px; right: 20px; left: 20px;
            background: rgba(15, 15, 20, 0.95); border-top: 4px solid #7c3aed;
            color: white; padding: 20px; border-radius: 12px; display: none; z-index: 5;
        }
        @media(min-width: 768px) {
            #hud-cartel { top: 30px; right: 30px; left: auto; bottom: auto; width: 340px; border-top: none; border-left: 4px solid #7c3aed; }
        }
        #hud-cartel h2 { margin: 0 0 6px 0; font-size: 1.2em; color: #a78bfa; }
        #hud-cartel h3 { margin: 0 0 10px 0; font-size: 0.95em; color: #9ca3af; }
        #hud-cartel p { font-size: 0.85em; line-height: 1.5; color: #e5e7eb; }
        .mrc-tag { font-size: 0.7em; background: #7c3aed; padding: 3px 8px; border-radius: 4px; font-weight: bold; }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="blocker">
        <div id="instructions">
            ENTRER DANS LE VERNISSAGE MRC<br>
            <span style="font-size: 12px; color:#a78bfa; display:block; margin-top:10px;">Touches à gauche pour marcher.<br>Glisser l'écran à droite pour regarder autour.</span>
        </div>
    </div>

    <div id="pad-zone">
        <div id="btn-up" class="btn-dir">▲</div>
        <div id="btn-left" class="btn-dir">◀</div>
        <div id="btn-right" class="btn-dir">▶</div>
        <div id="btn-down" class="btn-dir">▼</div>
    </div>

    <div id="hud-cartel">
        <span class="mrc-tag">Protocole MRC Authentifié</span>
        <h2 id="art-title">Nom de l'œuvre</h2>
        <h3 id="art-artist">Par Artiste</h3>
        <p id="art-desc">Description</p>
        <small style="color: #6b7280; font-family: monospace; font-size:0.75em;" id="art-hash">0x...</small>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        let camera, scene, renderer, controls;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        
        let isMobile = false;
        let touchStartPoint = { x: 0, y: 0 };
        const euler = new THREE.Euler(0, 0, 0, 'YXZ');

        const artworks = []; 
        const raycasterProximite = new THREE.Raycaster();

        const mrcDatabase = [
            { id: "art1", title: "Genèse Polygon #01", artist: "MoonRoadX", desc: "Première structure matricielle immuable générée via le protocole MRC sur le réseau Polygon.", hash: "0x7a8b92c...32f1", img: "https://picsum.photos/id/1043/800/800" },
            { id: "art2", title: "Flot Séquentiel #04", artist: "Eva R.", desc: "Étude cinétique des flux de blocs et de gaz de la blockchain en temps réel.", hash: "0x4e9100a...88ab", img: "https://picsum.photos/id/1081/800/800" }
        ];

        init();
        animate();

        function init() {
            isMobile = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.7, 5); 

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x060609);
            scene.fog = new THREE.FogExp2(0x060609, 0.08);

            controls = new PointerLockControls(camera, document.body);
            const blocker = document.getElementById('blocker');
            
            if (!isMobile) {
                blocker.addEventListener('click', () => controls.lock());
                controls.addEventListener('lock', () => blocker.style.display = 'none');
                controls.addEventListener('unlock', () => blocker.style.display = 'flex');
                document.addEventListener('keydown', (e) => handleKey(e.code, true));
                document.addEventListener('keyup', (e) => handleKey(e.code, false));
            } else {
                blocker.addEventListener('touchstart', () => {
                    blocker.style.display = 'none';
                    document.getElementById('pad-zone').style.display = 'block';
                });
                initMobileControls();
            }

            scene.add(controls.getObject());

            // --- ÉCLAIRAGE ---
            scene.add(new THREE.AmbientLight(0xffffff, 0.1));
            const topLight = new THREE.DirectionalLight(0xa78bfa, 0.3);
            topLight.position.set(0, 10, 0);
            scene.add(topLight);

            // --- DECOR ---
            const floor = new THREE.Mesh(
                new THREE.PlaneGeometry(40, 40), 
                new THREE.MeshStandardMaterial({ color: 0x121216, roughness: 0.2, metalness: 0.3 })
            );
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            const backWall = new THREE.Mesh(
                new THREE.PlaneGeometry(40, 6), 
                new THREE.MeshStandardMaterial({ color: 0x1a1a22, roughness: 0.8 })
            );
            backWall.position.set(0, 3, -6);
            scene.add(backWall);

            // Accrochage
            accrocherTableau(-3, 2.3, -5.9, mrcDatabase[0]);
            accrocherTableau(3, 2.3, -5.9, mrcDatabase[1]);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            window.addEventListener('resize', onWindowResize);
        }

        function handleKey(code, isDown) {
            switch (code) {
                case 'KeyW': case 'ArrowUp': moveForward = isDown; break;
                case 'KeyA': case 'ArrowLeft': moveLeft = isDown; break;
                case 'KeyS': case 'ArrowDown': moveBackward = isDown; break;
                case 'KeyD': case 'ArrowRight': moveRight = isDown; break;
            }
        }

        function initMobileControls() {
            // Configuration des écoutes tactiles sur les flèches HTML
            const setupBtn = (id, pressHandler) => {
                const el = document.getElementById(id);
                el.addEventListener('touchstart', (e) => { e.preventDefault(); pressHandler(true); }, {passive: false});
                el.addEventListener('touchend', (e) => { e.preventDefault(); pressHandler(false); }, {passive: false});
            };

            setupBtn('btn-up', (val) => moveForward = val);
            setupBtn('btn-down', (val) => moveBackward = val);
            setupBtn('btn-left', (val) => moveLeft = val);
            setupBtn('btn-right', (val) => moveRight = val);

            // Orientation du regard (Swipe sur la moitié droite de l'écran)
            window.addEventListener('touchstart', (e) => {
                if (e.touches[0].clientX < window.innerWidth / 2) return;
                touchStartPoint.x = e.touches[0].clientX;
                touchStartPoint.y = e.touches[0].clientY;
            }, { passive: true });

            window.addEventListener('touchmove', (e) => {
                if (e.touches[0].clientX < window.innerWidth / 2) return;
                
                const deltaX = e.touches[0].clientX - touchStartPoint.x;
                const deltaY = e.touches[0].clientY - touchStartPoint.y;

                touchStartPoint.x = e.touches[0].clientX;
                touchStartPoint.y = e.touches[0].clientY;

                const sensitivity = 0.004; // Sensibilité du regard
                euler.setFromQuaternion(camera.quaternion);
                euler.y -= deltaX * sensitivity;
                euler.x -= deltaY * sensitivity;
                
                euler.x = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, euler.x));
                camera.quaternion.setFromEuler(euler);
            }, { passive: true });
        }

        function accrocherTableau(x, y, z, metadata) {
            const group = new THREE.Group();
            group.position.set(x, y, z);
            
            const cadre = new THREE.Mesh(
                new THREE.BoxGeometry(2.4, 2.4, 0.1), 
                new THREE.MeshStandardMaterial({ color: 0x0a0a0d, roughness: 0.5 })
            );
            group.add(cadre);

            new THREE.TextureLoader().load(metadata.img, (txt) => {
                const toile = new THREE.Mesh(new THREE.PlaneGeometry(2.2, 2.2), new THREE.MeshStandardMaterial({ map: txt }));
                toile.position.z = 0.06;
                toile.userData = metadata;
                group.add(toile);
                artworks.push(toile);
            });

            const spotLight = new THREE.SpotLight(0xffffff, 7, 10, Math.PI / 5, 0.5, 1);
            spotLight.position.set(x, 5, z + 2);
            spotLight.target = group;
            scene.add(spotLight);
            scene.add(spotLight.target);

            scene.add(group);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            // Vitesse de déplacement fixe et réactive pour mobile
            const moveSpeed = 0.08; 

            if (isMobile) {
                const camDirection = new THREE.Vector3();
                camera.getWorldDirection(camDirection);
                camDirection.y = 0; // Conserve la hauteur fixe (marche au sol)
                camDirection.normalize();

                const camRight = new THREE.Vector3();
                camRight.crossVectors(camera.up, camDirection).normalize();

                if (moveForward) camera.position.addScaledVector(camDirection, moveSpeed);
                if (moveBackward) camera.position.addScaledVector(camDirection, -moveSpeed);
                if (moveLeft) camera.position.addScaledVector(camRight, moveSpeed);
                if (moveRight) camera.position.addScaledVector(camRight, -moveSpeed);
            }

            // Limites des murs
            const pos = camera.position;
            if (pos.x > 14) pos.x = 14; if (pos.x < -14) pos.x = -14;
            if (pos.z > 14) pos.z = 14; if (pos.z < -4) pos.z = -4;

            // Scanner de proximité
            raycasterProximite.setFromCamera(new THREE.Vector2(0, 0), camera);
            const intersects = raycasterProximite.intersectObjects(artworks);

            const hud = document.getElementById('hud-cartel');
            if (intersects.length > 0 && intersects[0].distance < 3.5) {
                const data = intersects[0].object.userData;
                document.getElementById('art-title').innerText = data.title;
                document.getElementById('art-artist').innerText = `Par : ${data.artist}`;
                document.getElementById('art-desc').innerText = data.desc;
                document.getElementById('art-hash').innerText = `Polygon: ${data.hash}`;
                hud.style.display = 'block';
            } else {
                hud.style.display = 'none';
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>

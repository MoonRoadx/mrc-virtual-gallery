<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Vernissage Interactif - Passeports MRC</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%; font-family: 'Segoe UI', sans-serif; background-color: #060609; user-select: none; -webkit-user-select: none; }
        canvas { display: block; }

        #blocker {
            position: absolute; width: 100%; height: 100%;
            background-color: rgba(6, 6, 9, 0.95);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: #fff; text-align: center; cursor: pointer; z-index: 10;
        }
        #instructions { font-size: 18px; border: 2px solid #7c3aed; padding: 25px; border-radius: 12px; background: rgba(124, 58, 237, 0.15); text-align: center; max-width: 85%; }
        
        #pad-zone { position: absolute; bottom: 30px; left: 30px; width: 140px; height: 140px; z-index: 20; display: none; }
        .btn-dir { position: absolute; background: rgba(124, 58, 237, 0.3); border: 2px solid rgba(167, 139, 250, 0.6); border-radius: 8px; color: white; font-weight: bold; text-align: center; line-height: 44px; width: 44px; height: 44px; font-size: 18px; }
        #btn-up { top: 0; left: 48px; }
        #btn-left { top: 48px; left: 0; }
        #btn-right { top: 48px; right: 0; }
        #btn-down { bottom: 0; left: 48px; }

        #hud-cartel {
            position: absolute; bottom: 20px; right: 20px; left: 20px;
            background: rgba(15, 15, 20, 0.95); border-top: 4px solid #7c3aed;
            color: white; padding: 20px; border-radius: 12px; display: none; z-index: 5; backdrop-filter: blur(10px);
        }
        @media(min-width: 768px) { #hud-cartel { top: 30px; right: 30px; left: auto; bottom: auto; width: 340px; border-top: none; border-left: 4px solid #7c3aed; } }
        #hud-cartel h2 { margin: 0 0 6px 0; font-size: 1.2em; color: #a78bfa; }
        #hud-cartel h3 { margin: 0 0 10px 0; font-size: 0.95em; color: #9ca3af; }
        #hud-cartel p { font-size: 0.85em; line-height: 1.5; color: #e5e7eb; margin-bottom: 10px; }
        .mrc-tag { font-size: 0.7em; background: #7c3aed; padding: 3px 8px; border-radius: 4px; font-weight: bold; text-transform: uppercase; }
        
        #loading-txt { color: #a78bfa; font-size: 14px; margin-top: 15px; font-weight: bold; font-family: monospace; }
    </style>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.1/ethers.umd.min.js"></script>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="blocker">
        <div id="instructions">
            ENTRER DANS L'EXPOSITION MRC<br>
            <span style="font-size: 12px; color:#a78bfa; display:block; margin-top:10px;">Pavé tactile à gauche pour marcher.<br>Glissez votre pouce à droite pour regarder autour.</span>
            <div id="loading-txt">Initialisation de la liaison Polygon...</div>
        </div>
    </div>

    <div id="pad-zone">
        <div id="btn-up" class="btn-dir">▲</div>
        <div id="btn-left" class="btn-dir">◀</div>
        <div id="btn-right" class="btn-dir">▶</div>
        <div id="btn-down" class="btn-dir">▼</div>
    </div>

    <div id="hud-cartel">
        <span class="mrc-tag">Passeport MRC Authentifié</span>
        <h2 id="art-title">Chargement...</h2>
        <h3 id="art-artist">Propriétaire : --</h3>
        <p id="art-desc">Métadonnées issues de la Blockchain Polygon.</p>
        <small style="color: #6b7280; font-family: monospace; font-size:0.75em; display:block; word-break: break-all;" id="art-hash">Token ID: --</small>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        let camera, scene, renderer, controls;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let isMobile = false;
        let touchStartPoint = { x: 0, y: 0 };
        const euler = new THREE.Euler(0, 0, 0, 'YXZ');
        const artworks = []; 
        const raycasterProximite = new THREE.Raycaster();

        // CONFIGURATION SMART CONTRACT LIVE
        const contractAddress = "0x5De79f385FFe00DD5951AaB522082B6F76a084ac"; 
        const tokenIdsToExpose = [1, 3, 4]; 

        const mrcABI = [
            "function tokenURI(uint256 tokenId) public view returns (string memory)",
            "function ownerOf(uint256 tokenId) public view returns (address)"
        ];

        // Passerelle IPFS Cloudflare / IPFS.io stable
        const ipfsGateway = "https://cloudflare-ipfs.com/ipfs/";
        function formatIpfsUrl(url) {
            if (!url) return "";
            if (url.startsWith("ipfs://")) {
                return url.replace("ipfs://", ipfsGateway);
            }
            return url;
        }

        init();

        async function init() {
            isMobile = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.7, 7); // Position initiale reculée pour faire face aux oeuvres

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x060609);
            scene.fog = new THREE.FogExp2(0x060609, 0.06);

            controls = new PointerLockControls(camera, document.body);
            const blocker = document.getElementById('blocker');
            
            if (!isMobile) {
                blocker.addEventListener('click', () => controls.lock());
                controls.addEventListener('lock', () => blocker.style.display = 'none');
                controls.addEventListener('unlock', () => blocker.style.display = 'flex');
                document.addEventListener('keydown', (e) => handleKey(e.code, true));
                document.addEventListener('keyup', (e) => handleKey(e.code, false));
            } else {
                blocker.addEventListener('touchstart', () => {
                    blocker.style.display = 'none';
                    document.getElementById('pad-zone').style.display = 'block';
                });
                initMobileControls();
            }

            scene.add(controls.getObject());

            // Éclairages
            scene.add(new THREE.AmbientLight(0xffffff, 0.12));
            const topLight = new THREE.DirectionalLight(0xa78bfa, 0.4);
            topLight.position.set(0, 10, 0);
            scene.add(topLight);

            // Environnement
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(50, 50), new THREE.MeshStandardMaterial({ color: 0x111115, roughness: 0.2, metalness: 0.4 }));
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            const backWall = new THREE.Mesh(new THREE.PlaneGeometry(50, 7), new THREE.MeshStandardMaterial({ color: 0x181820, roughness: 0.8 }));
            backWall.position.set(0, 3.5, -6);
            scene.add(backWall);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            window.addEventListener('resize', onWindowResize);

            // Exécution du chargement Polygon avant de lancer le rendu final
            await chargerOeuvresDepuisBlockchain();

            animate();
        }

        async function chargerOeuvresDepuisBlockchain() {
            const loadingText = document.getElementById('loading-txt');
            try {
                // Utilisation d'un endpoint RPC public ultra-rapide pour Polygon Mainnet
                const provider = new ethers.JsonRpcProvider("https://polygon-rpc.com");
                const contract = new ethers.Contract(contractAddress, mrcABI, provider);
                
                // On centre les trois tableaux sur le mur
                let positionX = -5; // Premier tableau à gauche (-5), second au centre (0), troisième à droite (5)

                for (let i = 0; i < tokenIdsToExpose.length; i++) {
                    const tokenId = tokenIdsToExpose[i];
                    loadingText.innerText = `Lecture Blockchain : Passeport #${tokenId}...`;

                    // Requête RPC 1 : Récupérer le lien des métadonnées JSON
                    const tokenURI = await contract.tokenURI(tokenId);
                    const jsonURL = formatIpfsUrl(tokenURI);

                    // Requête HTTP : Récupérer le fichier de configuration JSON du NFT
                    const response = await fetch(jsonURL);
                    const metadata = await response.json();

                    // Requête RPC 2 : Récupérer l'adresse Polygon du propriétaire actuel
                    let owner = "Adresse non disponible";
                    try { 
                        owner = await contract.ownerOf(tokenId); 
                        owner = `${owner.substring(0, 6)}...${owner.substring(owner.length - 4)}`;
                    } catch(e){}

                    // Construction des informations pour l'expérience interactive
                    const artworkData = {
                        title: metadata.name || `Passeport MRC #${tokenId}`,
                        artist: `Owner : ${owner}`,
                        desc: metadata.description || "Document ou actif numérique authentifié via le protocole MRC.",
                        hash: `Contract: ${contractAddress.substring(0,6)}... | TokenID: ${tokenId}`,
                        img: formatIpfsUrl(metadata.image)
                    };

                    // Intégration 3D dans le musée virtuel
                    accrocherTableau(positionX, 2.3, -5.9, artworkData);
                    
                    // Espace de 5 mètres entre chaque tableau
                    positionX += 5; 
                }

                loadingText.innerText = "Connexion Polygon Mainnet validée ! Cliquez pour visiter.";

            } catch (error) {
                console.error("Erreur d'appel Blockchain:", error);
                loadingText.innerHTML = "<span style='color:#f87171;'>Échec de synchronisation. Vérifiez votre connexion.</span>";
            }
        }

        function handleKey(code, isDown) {
            switch (code) {
                case 'KeyW': case 'ArrowUp': moveForward = isDown; break;
                case 'KeyA': case 'ArrowLeft': moveLeft = isDown; break;
                case 'KeyS': case 'ArrowDown': moveBackward = isDown; break;
                case 'KeyD': case 'ArrowRight': moveRight = isDown; break;
            }
        }

        function initMobileControls() {
            const setupBtn = (id, pressHandler) => {
                const el = document.getElementById(id);
                el.addEventListener('touchstart', (e) => { e.preventDefault(); pressHandler(true); }, {passive: false});
                el.addEventListener('touchend', (e) => { e.preventDefault(); pressHandler(false); }, {passive: false});
            };
            setupBtn('btn-up', (val) => moveForward = val);
            setupBtn('btn-down', (val) => moveBackward = val);
            setupBtn('btn-left', (val) => moveLeft = val);
            setupBtn('btn-right', (val) => moveRight = val);

            window.addEventListener('touchstart', (e) => {
                if (e.touches[0].clientX < window.innerWidth / 2) return;
                touchStartPoint.x = e.touches[0].clientX;
                touchStartPoint.y = e.touches[0].clientY;
            }, { passive: true });

            window.addEventListener('touchmove', (e) => {
                if (e.touches[0].clientX < window.innerWidth / 2) return;
                const deltaX = e.touches[0].clientX - touchStartPoint.x;
                const deltaY = e.touches[0].clientY - touchStartPoint.y;
                touchStartPoint.x = e.touches[0].clientX;
                touchStartPoint.y = e.touches[0].clientY;

                const sensitivity = 0.0045;
                euler.setFromQuaternion(camera.quaternion);
                euler.y -= deltaX * sensitivity;
                euler.x -= deltaY * sensitivity;
                euler.x = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, euler.x));
                camera.quaternion.setFromEuler(euler);
            }, { passive: true });
        }

        function accrocherTableau(x, y, z, metadata) {
            const group = new THREE.Group();
            group.position.set(x, y, z);
            
            // Cadre d'exposition
            const cadre = new THREE.Mesh(new THREE.BoxGeometry(2.2, 2.2, 0.1), new THREE.MeshStandardMaterial({ color: 0x09090c, roughness: 0.5, metalness: 0.2 }));
            group.add(cadre);

            // Toile avec texture dynamique
            new THREE.TextureLoader().load(metadata.img, (txt) => {
                const toile = new THREE.Mesh(new THREE.PlaneGeometry(2.0, 2.0), new THREE.MeshStandardMaterial({ map: txt, roughness: 0.3 }));
                toile.position.z = 0.06;
                toile.userData = metadata;
                group.add(toile);
                artworks.push(toile);
            });

            // Projecteur de lumière individuel
            const spotLight = new THREE.SpotLight(0xffffff, 8, 10, Math.PI / 5, 0.5, 1);
            spotLight.position.set(x, 5.5, z + 2);
            spotLight.target = group;
            scene.add(spotLight);
            scene.add(spotLight.target);

            scene.add(group);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const moveSpeed = 0.085; 

            if (isMobile) {
                const camDirection = new THREE.Vector3();
                camera.getWorldDirection(camDirection);
                camDirection.y = 0; 
                camDirection.normalize();
                const camRight = new THREE.Vector3();
                camRight.crossVectors(camera.up, camDirection).normalize();

                if (moveForward) camera.position.addScaledVector(camDirection, moveSpeed);
                if (moveBackward) camera.position.addScaledVector(camDirection, -moveSpeed);
                if (moveLeft) camera.position.addScaledVector(camRight, moveSpeed);
                if (moveRight) camera.position.addScaledVector(camRight, -moveSpeed);
            }

            const pos = camera.position;
            if (pos.x > 18) pos.x = 18; if (pos.x < -18) pos.x = -18;
            if (pos.z > 18) pos.z = 18; if (pos.z < -4) pos.z = -4;

            raycasterProximite.setFromCamera(new THREE.Vector2(0, 0), camera);
            const intersects = raycasterProximite.intersectObjects(artworks);

            const hud = document.getElementById('hud-cartel');
            if (intersects.length > 0 && intersects[0].distance < 3.8) {
                const data = intersects[0].object.userData;
                document.getElementById('art-title').innerText = data.title;
                document.getElementById('art-artist').innerText = data.artist;
                document.getElementById('art-desc').innerText = data.desc;
                document.getElementById('art-hash').innerText = data.hash;
                hud.style.display = 'block';
            } else {
                hud.style.display = 'none';
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
